name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit tracked files
        run: python -m ipo_lottery.audit
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q --cov=src/ipo_lottery --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ipo-lottery-allocation .
      - name: Run synthetic pipeline
        run: docker run --rm ipo-lottery-allocation
